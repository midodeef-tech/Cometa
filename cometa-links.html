<style>
:root{
  --bg:#EFE8DC; --surface:#F7F2E9; --ink:#2E1D12; --muted:#7A6652; --line:#CDBFA8; --brass:#9A7B43; --wood:#6B4426;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--wood:#C9A66B;--bg:#1E140D; --surface:#2A1D13; --ink:#F1E8D8; --muted:#B5A28A; --line:#4A3726; --brass:#C9A66B; color-scheme:dark;}
}
:root[data-theme="dark"]{--wood:#C9A66B;--bg:#1E140D; --surface:#2A1D13; --ink:#F1E8D8; --muted:#B5A28A; --line:#4A3726; --brass:#C9A66B; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jost','Helvetica Neue',Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{position:relative;z-index:1;width:100%;max-width:480px;padding:48px 24px 48px}
.wood{position:fixed;top:0;bottom:0;width:min(24vw,300px);pointer-events:none;z-index:0}
.wood.l{left:0}.wood.r{right:0}
.wood i{position:absolute;inset:0;background:var(--wood)}
.l i:nth-child(1){clip-path:polygon(0 0,78% 0,30% 38%,0 52%);opacity:.10}
.l i:nth-child(2){clip-path:polygon(0 30%,55% 18%,100% 62%,40% 100%,0 100%);opacity:.07}
.l i:nth-child(3){clip-path:polygon(0 70%,45% 55%,70% 100%,0 100%);opacity:.09}
.r i:nth-child(1){clip-path:polygon(100% 0,25% 0,60% 34%,100% 48%);opacity:.09}
.r i:nth-child(2){clip-path:polygon(100% 22%,48% 40%,0 78%,62% 100%,100% 100%);opacity:.07}
.r i:nth-child(3){clip-path:polygon(100% 60%,52% 72%,30% 100%,100% 100%);opacity:.10}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:20px 4px;color:var(--ink);text-decoration:none;transition:padding .2s,color .2s}
a:hover{padding-left:12px;color:var(--brass)}
a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.name{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:500}
.hint{font-size:14px;color:var(--muted);text-align:right;overflow-wrap:anywhere}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
@media (prefers-reduced-motion:reduce){a{transition:none}}

<main>
  <h1 class="sr">COMETA FURNITURE</h1>
  <div class="logo" role="img" aria-label="COMETA FURNITURE logo"></div>
  <ul id="links"></ul>
  <footer>Developed by | Mohamed Daif</footer>
</main>
<script>
// Edit the links below: name, hint (small text on the right), and url.
const LINKS = [
  { name: "Instagram",  hint: "COMETA FURNITURE",       url: "https://www.instagram.com/cometa_furniture/" },
  { name: "Facebook",   hint: "COMETA FURNITURE",       url: "https://www.facebook.com/cometafurnituree" },
  { name: "TikTok",     hint: "Cometa Furniture",       url: "https://www.tiktok.com/@cometa.furniture?_r=1&_t=ZS-9BXcuuFRAv4" },
  { name: "WhatsApp",   hint: "Message us",             url: "https://wa.me/+201080630644" },
  { name: "Showroom",   hint: "Find us on the map",     url: "https://maps.app.goo.gl/1pAUdDWnNbQZw2mi7" },
  { name: "Cataloge",   hint: "See Our Collections",    url:"https://drive.google.com/file/d/1eooFSCHQFVMw7y0LAuhjb_GiXs85NIex/view?usp=sharing" },
];
const ul = document.getElementById('links');
LINKS.forEach(l => {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = '<span class="name"></span><span class="hint"></span>';
  a.querySelector('.name').textContent = l.name;
  a.querySelector('.hint').textContent = l.hint;
  li.appendChild(a); ul.appendChild(li);
});
</script>
